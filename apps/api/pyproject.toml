[project]
name = "course-tutor-api"
version = "0.1.0"
description = "FastAPI gateway / BFF"
requires-python = ">=3.12"
dependencies = [
    "course-tutor-auth",
    "course-tutor-contracts",
    "course-tutor-shared",
    "course-tutor-retrieval",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "qdrant-client>=1.12,<1.13",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=50.0.0,<51",
]

[tool.uv.sources]
course-tutor-auth = { workspace = true }
course-tutor-contracts = { workspace = true }
course-tutor-shared = { workspace = true }
course-tutor-retrieval = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_tutor_api"]
