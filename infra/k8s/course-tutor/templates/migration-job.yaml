apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "course-tutor.fullname" . }}-migrate-{{ .Release.Revision }}
  labels:
    {{- include "course-tutor.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "course-tutor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "course-tutor.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: {{ include "course-tutor.image" (list .Values.backend.agent.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["alembic", "-c", "apps/api/alembic.ini", "upgrade", "head"]
          env:
            - name: POSTGRES_DSN
              value: {{ .Values.config.postgresDsn | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: runtime-tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
      volumes:
        - {name: runtime-tmp, emptyDir: {}}
