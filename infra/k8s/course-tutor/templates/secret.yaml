{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "course-tutor.secretName" . }}
  labels:
    {{- include "course-tutor.labels" . | nindent 4 }}
type: Opaque
stringData:
  local-auth-token: {{ required "secrets.localAuthToken is required" .Values.secrets.localAuthToken | quote }}
  minio-access-key: {{ required "secrets.minioAccessKey is required" .Values.secrets.minioAccessKey | quote }}
  minio-secret-key: {{ required "secrets.minioSecretKey is required" .Values.secrets.minioSecretKey | quote }}
  llm-api-key: {{ required "secrets.llmApiKey is required" .Values.secrets.llmApiKey | quote }}
{{- end }}
