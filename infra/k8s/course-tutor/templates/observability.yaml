{{- if and .Values.config.metricsEnabled .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "course-tutor.fullname" . }}-worker-metrics
  labels:
    {{- include "course-tutor.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
    course-tutor.io/metrics: "true"
spec:
  selector:
    {{- include "course-tutor.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  ports:
    - {name: metrics, port: {{ .Values.worker.metricsPort }}, targetPort: metrics}
{{- if .Values.observability.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "course-tutor.fullname" . }}
  labels:
    {{- include "course-tutor.labels" . | nindent 4 }}
    {{- with .Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      course-tutor.io/metrics: "true"
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
    - port: metrics
      path: /metrics
      interval: {{ .Values.observability.serviceMonitor.interval }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "course-tutor.fullname" . }}-release-metadata
  labels:
    {{- include "course-tutor.labels" . | nindent 4 }}
data:
  chart-version: {{ .Chart.Version | quote }}
  app-version: {{ .Chart.AppVersion | quote }}
  revision: {{ .Values.global.buildRevision | quote }}
  actor: {{ .Values.global.releaseActor | quote }}
  environment: {{ .Values.global.releaseEnvironment | quote }}
  verification-result: {{ .Values.global.verificationResult | quote }}
  agent-image: {{ include "course-tutor.image" (list .Values.backend.agent.image) | quote }}
  practice-image: {{ include "course-tutor.image" (list .Values.backend.practice.image) | quote }}
  worker-image: {{ include "course-tutor.image" (list .Values.worker.image) | quote }}
  web-image: {{ include "course-tutor.image" (list .Values.web.image) | quote }}
