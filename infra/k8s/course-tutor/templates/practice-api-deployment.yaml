apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "course-tutor.fullname" . }}-practice-api
  labels:
    {{- include "course-tutor.labels" . | nindent 4 }}
    app.kubernetes.io/component: practice-api
spec:
  replicas: {{ .Values.backend.practice.replicas }}
  revisionHistoryLimit: {{ .Values.backend.practice.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "course-tutor.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: practice-api
  template:
    metadata:
      labels:
        {{- include "course-tutor.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: practice-api
      annotations:
        checksum/runtime-secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.observability.prometheusAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.backend.practice.port | quote }}
        prometheus.io/path: /metrics
        {{- end }}
    spec:
      serviceAccountName: {{ include "course-tutor.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-practice-migration
          image: {{ include "course-tutor.image" (list .Values.backend.practice.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["python", "-m", "course_tutor_practice.wait_for_migration"]
          env:
            {{- include "course-tutor.practiceDsnEnv" . | nindent 12 }}
            - name: EXPECTED_PRACTICE_ALEMBIC_REVISION
              value: {{ .Values.config.expectedPracticeAlembicRevision | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: runtime-tmp, mountPath: /tmp}
      containers:
        - name: practice-api
          image: {{ include "course-tutor.image" (list .Values.backend.practice.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - {name: practice-http, containerPort: {{ .Values.backend.practice.port }}, protocol: TCP}
          env:
            {{- include "course-tutor.practiceEnv" . | nindent 12 }}
          readinessProbe:
            httpGet: {path: /readyz, port: practice-http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: practice-http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.backend.practice.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: runtime-tmp, mountPath: /tmp}
      volumes:
        - {name: runtime-tmp, emptyDir: {}}
