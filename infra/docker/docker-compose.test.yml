name: course-tutor-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: course_tutor_test_local
      POSTGRES_USER: course_tutor
      POSTGRES_PASSWORD: course_tutor
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_tutor -d course_tutor_test_local"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["56333:6333"]

  minio:
    # SeaweedFS provides the S3 API used by the application without depending on
    # the discontinued public MinIO container repository.
    image: chrislusf/seaweedfs:4.47
    command: server -dir=/data -s3 -s3.port=9000 -ip.bind=0.0.0.0 -volume.max=0
    environment:
      AWS_ACCESS_KEY_ID: course-tutor
      AWS_SECRET_ACCESS_KEY: course-tutor-test-secret
    ports: ["59000:9000"]
    healthcheck:
      test: ["CMD", "curl", "--silent", "--output", "/dev/null", "http://127.0.0.1:9000/"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
