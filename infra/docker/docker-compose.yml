# Production-style deployment (same images work for local dev too).
# Uses pre-built images when CI builds them, or local builds during development.
name: course-tutor

services:
  # ── Shared dependencies ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: course_tutor
      POSTGRES_USER: course_tutor
      POSTGRES_PASSWORD: course_tutor
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_tutor -d course_tutor"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
      - "${QDRANT_GRPC_HOST_PORT:-6334}:6334"
    volumes: ["qdrant-data:/qdrant/storage"]
    healthcheck:
      test: ["CMD", "/qdrant/qdrant", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["${REDIS_HOST_PORT:-6380}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-course-tutor}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change-me-in-production}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application services ────────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      target: runtime
    ports: ["${API_HOST_PORT:-8011}:8000"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: course_tutor
      POSTGRES_USER: course_tutor
      POSTGRES_PASSWORD: course_tutor
      POSTGRES_DSN: postgresql+asyncpg://course_tutor:course_tutor@postgres:5432/course_tutor
      # Redis
      REDIS_URL: redis://redis:6379/0
      # Qdrant
      QDRANT_URL: http://qdrant:6333
      # Object store
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-course-tutor}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-in-production}
      MINIO_BUCKET: course-tutor
      MINIO_SECURE: "false"
      # LLM
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen/qwen3.6-35b-a3b}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}
      LLM_EMBEDDING_DIMENSION: ${LLM_EMBEDDING_DIMENSION:-1024}
      # Tracing
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports: ["${WEB_HOST_PORT:-3011}:80"]
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
      target: runtime
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: course_tutor
      POSTGRES_USER: course_tutor
      POSTGRES_PASSWORD: course_tutor
      POSTGRES_DSN: postgresql+asyncpg://course_tutor:course_tutor@postgres:5432/course_tutor
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-course-tutor}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-me-in-production}
      MINIO_BUCKET: course-tutor
      MINIO_SECURE: "false"
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-qwen/qwen3.6-35b-a3b}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-qwen3-embedding-0.6b}
      LLM_EMBEDDING_DIMENSION: ${LLM_EMBEDDING_DIMENSION:-1024}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

volumes:
  postgres-data:
  qdrant-data:
  redis-data:
  minio-data:
