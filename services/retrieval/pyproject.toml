[project]
name = "course-tutor-retrieval"
version = "0.1.0"
description = "Dense retrieval, deterministic reranking and citation packaging"
requires-python = ">=3.12"
dependencies = [
    "course-tutor-contracts",
    "course-tutor-shared",
    "qdrant-client>=1.12,<1.13",
    "structlog>=24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv.sources]
course-tutor-contracts = { workspace = true }
course-tutor-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_tutor_retrieval"]
