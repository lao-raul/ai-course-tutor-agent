[project]
name = "course-tutor-practice-worker"
version = "0.1.0"
description = "Hiruzen generation outbox consumer"
requires-python = ">=3.12"
dependencies = [
    "course-tutor-contracts",
    "course-tutor-practice",
    "course-tutor-shared",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv.sources]
course-tutor-contracts = { workspace = true }
course-tutor-practice = { workspace = true }
course-tutor-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_tutor_practice_worker"]
