name: Publish immutable release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Tested commit or tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ github.event.workflow_run.head_sha || inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.publish.outputs.release_sha }}
      release_version: ${{ steps.publish.outputs.release_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve immutable source revision
        id: source
        run: echo "release_sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
      - name: Require successful CI for manual publication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          result="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${release_sha}&status=success&per_page=1")"
          test "$(jq '.total_count' <<<"${result}")" -ge 1
      - name: Authenticate to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Authenticate Helm to GHCR
        run: echo "${{ github.token }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build once, attest, sign and publish
        id: publish
        env:
          REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          BUILD_SOURCE: ${{ github.server_url }}/${{ github.repository }}
          REQUIRE_COSIGN: "true"
        run: scripts/publish-release.sh
      - name: Scan published Agent digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/course-tutor-agent@${{ steps.publish.outputs.agent_digest }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published Practice digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/course-tutor-practice@${{ steps.publish.outputs.practice_digest }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published Worker digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/course-tutor-worker@${{ steps.publish.outputs.worker_digest }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published Web digest
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/course-tutor-web@${{ steps.publish.outputs.web_digest }}
          scan-type: image
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.publish.outputs.release_sha }}
          path: build/release
          if-no-files-found: error
          retention-days: 90
      - name: Release summary
        run: |
          echo "### Immutable release ${{ steps.publish.outputs.release_version }}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          jq . build/release/release-manifest.json >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
