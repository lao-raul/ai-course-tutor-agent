name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI must not depend on the LAN LM Studio host or the NAS.
  LLM_BASE_URL: http://localhost:1234/v1
  LLM_CHAT_MODEL: ci-chat
  LLM_EMBEDDING_MODEL: ci-embedding
  LLM_EMBEDDING_DIMENSION: "1024"
  POSTGRES_DSN: postgresql+asyncpg://course_tutor:course_tutor@localhost:5432/course_tutor
  REDIS_URL: redis://localhost:6379/0

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy packages apps

      - name: Test
        run: uv run pytest --ignore=tests/integration/

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: course_tutor
          POSTGRES_USER: course_tutor
          POSTGRES_PASSWORD: course_tutor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U course_tutor"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Migrations apply, reverse and re-apply
        working-directory: apps/api
        run: |
          uv run --project ../.. alembic -c apps/api/alembic.ini upgrade head
          uv run --project ../.. alembic -c apps/api/alembic.ini downgrade base
          uv run --project ../.. alembic -c apps/api/alembic.ini upgrade head

      - name: Models and migrations are in sync
        working-directory: apps/api
        run: uv run --project ../.. alembic -c apps/api/alembic.ini check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
