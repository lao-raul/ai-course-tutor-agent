[project]
name = "course-tutor-auth"
version = "0.1.0"
description = "Shared authentication and course-scope authorization for Course Tutor apps"
requires-python = ">=3.12"
dependencies = [
    "course-tutor-contracts",
    "course-tutor-shared",
    "fastapi>=0.115",
    "pyjwt[crypto]>=2.10,<3",
    "cryptography>=43,<46",
]

[tool.uv.sources]
course-tutor-contracts = { workspace = true }
course-tutor-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_tutor_auth"]
