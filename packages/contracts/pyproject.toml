[project]
name = "course-tutor-contracts"
version = "0.1.0"
description = "Versioned domain, API and event schemas shared across services"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_tutor_contracts"]
