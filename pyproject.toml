[project]
name = "ai-course-tutor-agent"
version = "0.1.0"
description = "Local-first, RAG-powered course teaching assistant"
requires-python = ">=3.12"
dependencies = [
    "course-tutor-api",
    "course-tutor-contracts",
    "course-tutor-ingestion",
    "course-tutor-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "detect-secrets>=1.5",
]

[tool.uv.workspace]
# services/* join the workspace as each is implemented (Phase 1 onward).
members = ["apps/api", "packages/*", "services/ingestion", "services/retrieval"]

[tool.uv.sources]
course-tutor-api = { workspace = true }
course-tutor-contracts = { workspace = true }
course-tutor-ingestion = { workspace = true }
course-tutor-shared = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is expected in tests

[tool.ruff.lint.isort]
known-first-party = ["course_tutor_api", "course_tutor_contracts", "course_tutor_shared", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"tests/integration/test_ingestion_idempotency.py" = ["E501"]
# Alembic revisions are generated; long inline SQL is expected and must not be reflowed.
"apps/api/alembic/versions/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
# Generated revisions are not hand-maintained code.
exclude = "apps/api/alembic/versions/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
